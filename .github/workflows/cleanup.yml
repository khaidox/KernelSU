name: Cleanup Old Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel active runs and wipe all run history
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;

            console.log(`Current Cleanup Run ID: ${currentRunId}`);

            // Step 1: Cancel any in-progress or queued runs
            let runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            for (const r of runs) {
              if (r.id !== currentRunId && (r.status === 'in_progress' || r.status === 'queued')) {
                console.log(`Cancelling run ${r.id} (${r.name})...`);
                try {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: r.id });
                } catch (e) {
                  console.log(`Cancel error for ${r.id}: ${e.message}`);
                }
              }
            }

            // Step 2: Poll until all other runs are completed (max 60 seconds)
            for (let i = 0; i < 12; i++) {
              await new Promise(res => setTimeout(res, 5000));
              runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                per_page: 100
              });
              const active = runs.filter(r => r.id !== currentRunId && (r.status === 'in_progress' || r.status === 'queued'));
              console.log(`Waiting... ${active.length} runs still active`);
              if (active.length === 0) break;
            }

            // Step 3: Delete all completed runs except self
            runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100
            });

            for (const r of runs) {
              if (r.id !== currentRunId) {
                console.log(`Deleting run ${r.id} (${r.name})...`);
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: r.id });
                  console.log(`Deleted ${r.id}`);
                } catch (e) {
                  console.log(`Delete error for ${r.id}: ${e.message}`);
                }
              }
            }
            console.log("Cleanup completed!");
